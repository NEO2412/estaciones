<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist por estación</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4f0;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#c8102e;--ok:#1a7f4b;--bd:#e3dfd8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232322;--tx:#f1efea;--mu:#a09e97;--bd:#383836;--ac:#ff5a6e;--ok:#4cc789}}
:root[data-theme="dark"]{--bg:#171716;--card:#232322;--tx:#f1efea;--mu:#a09e97;--bd:#383836;--ac:#ff5a6e;--ok:#4cc789}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:20px 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.it{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--bd)}.it:last-child{border:0}
.it input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--ok);margin-top:1px}
.it.on .t{color:var(--mu);text-decoration:line-through}
.it .x{width:100%;margin-top:6px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.btn{display:inline-block;border:0;background:var(--ac);color:#fff;padding:12px 16px;border-radius:10px;font:600 15px inherit;cursor:pointer;margin:4px 6px 4px 0}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.st{display:block;width:100%;text-align:left;padding:14px;border:0;border-bottom:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 17px inherit;cursor:pointer}
.mu{color:var(--mu);font-size:14px}
.qg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.q{background:#fff;color:#000;border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:center;break-inside:avoid}
.q div{display:flex;justify-content:center}.q b{display:block;margin-top:8px}
input.u{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
@media print{.np{display:none}body{background:#fff}}
</style></head><body><div class="w" id="app"></div>
<script>
const COMMON=[["Lavado de manos",[
["Agua caliente disponible"],["Basurero con pedal"],["Jabón disponible"],["Fecha de vencimiento del jabón","d"],["Alcohol gel disponible"],["Fecha de vencimiento del alcohol gel","d"],
["Stock: guantes"],["Stock: nova"],["Stock: cepillo"],["Stock: sani"]]],
["Limpieza",[["Desagüe NO obstruido"],["Jaboneras limpias"],["Sin exceso de sarro"]]],
["Procedimiento y ayuda visual",[["Afiche de lavado de manos visible y legible"],["Personal conoce el procedimiento (ver pasos abajo)"]]]];
const SAN=["Sanitizante en concentración correcta","p"];
const PHU=[["PHU siempre con tiempo de retención"],["Si suena una PHU: descartar producto y avisar a jefatura"]];
const ST={
lavado:{n:"Lavado de manos",i:"🧼",s:COMMON,wash:1},
broiler:{n:"Broiler",i:"🔥",s:[["Tenazas",[["Tenazas dentro del taper y dentro del silver"],["4 tenazas en estación"],["Lift n grip y tenaza verde dentro del silver"],["Otra tenaza verde y una roja para sacar productos cocidos"],["Cada tenaza en su taper respectivo, sin cruces"]]],
["Producto",[["Bolsas de carne en el silver, rotuladas con nombre y fecha de vencimiento","d"]]],
["Higiene y equipo",[SAN,["Paño rojo respectivo en uso"],["Silver en buen funcionamiento"]]]]},
servicio:{n:"Servicio",i:"🛎️",s:[["Servicio",[["Boquilla de bebidas sin moho ni acumulación"],SAN,["Paño rojo respectivo en uso"],["Cajero NO es el mismo que arma o entrega pedidos"]]]]},
fritos:{n:"Fritos",i:"🍟",s:[["Cestas y producto",[["Cada producto en una cesta diferente"],["Productos NO se colocan en la cesta sobre el aceite"],["Todas las bolsas y taper rotulados con fecha de vencimiento","d"]]],
["Tenazas",[["4 tenazas en estación"],["Tenaza azul y verde dentro del silver"],["Otra verde y una roja para sacar productos fritos"],["Cada tenaza en su taper respectivo, sin cruces"]]],
["Higiene y equipo",[SAN,["Paño rojo respectivo en uso"],["Silver en buen funcionamiento"]]],["Control PHU",PHU]]},
board:{n:"Board",i:"🥪",s:[["Board",[["Pan en retención máximo 30 seg"],SAN,["Paño rojo respectivo en uso"],["Sin contaminación cruzada"]]],["Control PHU",PHU]]}};
const WASH=["Mójate manos y antebrazos con agua caliente","Aplica jabón","Frota palmas entre sí","Frota dorso de cada mano con la otra","Entrelaza dedos y frota entre ellos","Frota uñas y pulgares","Cepilla uñas si corresponde","Enjuaga bien (total ~20 seg de fricción)","Seca con toalla desechable","Cierra la llave con la toalla y bota en basurero de pedal","Aplica alcohol gel"];
const ENDPOINT="https://script.google.com/macros/s/AKfycbwxcwhNPinTWUuF8DcTihbvFkN0ccRFjq2cSpOs5dQbwARo47AVkmUtF8D4v4kU_W6S/exec";
function send(o){if(!ENDPOINT||ENDPOINT.indexOf('http')!==0)return Promise.resolve(false);o.ua=navigator.userAgent.slice(0,90);return fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)}).then(()=>true,()=>false)}
const $=s=>document.querySelector(s),app=$('#app');
const key=id=>'chk_'+id+'_'+new Date().toISOString().slice(0,10);
let state={};
function load(id){try{state=JSON.parse(localStorage.getItem(key(id))||'{}')}catch(e){state={}}}
function save(id){try{localStorage.setItem(key(id),JSON.stringify(state))}catch(e){}}
function total(id){return ST[id].s.reduce((a,s)=>a+s[1].length,0)}
function route(){const id=location.hash.slice(1);if(id==='qr')return qrView();if(ST[id])return stView(id);home()}
function home(){app.innerHTML=`<h1>Checklist de estaciones</h1><div class="c">${Object.keys(ST).map(k=>`<button class="st" onclick="location.hash='${k}'">${ST[k].i} ${ST[k].n}</button>`).join('')}</div>
<p><button class="btn g" onclick="location.hash='qr'">Generar códigos QR</button></p>`}
let opened={};function stView(id){load(id);const S=ST[id];let n=0;if(!opened[id]){opened[id]=1;send({tipo:'apertura',estacion:S.n})}
let h=`<p class="np"><a href="#" onclick="location.hash='';return false" class="mu">← Todas las estaciones</a></p><h1>${S.i} ${S.n}</h1><div class="mu">${new Date().toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'})}</div><div class="bar"><i id="pb"></i></div><div class="mu" id="pt"></div>`;
S.s.forEach((sec,si)=>{h+=`<h2>${sec[0]}</h2><div class="c">`;sec[1].forEach((it,ii)=>{const k=si+'_'+ii,on=state[k]&&state[k].c;
h+=`<label class="it ${on?'on':''}" id="r${k}"><input type="checkbox" ${on?'checked':''} onchange="tg('${id}','${k}',this)"><span style="flex:1"><span class="t">${it[0]}</span>`+
(it[1]?`<input class="x" type="${it[1]==='d'?'date':'text'}" placeholder="${it[1]==='p'?'Concentración (ppm) medida':''}" value="${(state[k]&&state[k].v)||''}" onclick="event.stopPropagation()" oninput="vl('${id}','${k}',this.value)">`:'')+`</span></label>`});h+=`</div>`});
if(S.wash)h+=`<h2>Procedimiento de lavado de manos</h2><div class="c">${WASH.map((w,i)=>`<div class="it"><b style="width:24px;color:var(--ac)">${i+1}</b><span>${w}</span></div>`).join('')}</div>`;
h+=`<h2>Observaciones</h2><textarea class="x it" style="width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;padding:10px" rows="3" oninput="vl('${id}','obs',this.value)">${(state.obs&&state.obs.v)||''}</textarea>
<h2>Responsable</h2><input class="u" id="who" placeholder="Nombre de quien revisa" value="${(state.who&&state.who.v)||''}" oninput="vl('${id}','who',this.value)">
<p class="np"><button class="btn" onclick="env('${id}')">Enviar registro</button><button class="btn g" onclick="cp('${id}')">Copiar resumen</button><button class="btn g" onclick="rs('${id}')">Reiniciar</button></p><div class="mu" id="msg"></div>`;
app.innerHTML=h;prog(id)}
function prog(id){const t=total(id),d=Object.keys(state).filter(k=>k!=='obs'&&k!=='who'&&state[k].c).length;$('#pb').style.width=(100*d/t)+'%';$('#pt').textContent=d+' de '+t+' controles OK'}
function tg(id,k,el){state[k]=state[k]||{};state[k].c=el.checked;$('#r'+k).classList.toggle('on',el.checked);save(id);prog(id)}
function vl(id,k,v){state[k]=state[k]||{};state[k].v=v;save(id)}
function env(id){const S=ST[id],m=$('#msg');if(!(state.who&&state.who.v)){m.textContent='Escribe tu nombre en Responsable antes de enviar.';return}
let ok=0,t=0,pen=[],det=[];S.s.forEach((sec,si)=>sec[1].forEach((it,ii)=>{const x=state[si+'_'+ii]||{};t++;if(x.c)ok++;else pen.push(it[0]);det.push((x.c?'OK: ':'PENDIENTE: ')+it[0]+(x.v?' ['+x.v+']':''))}));
m.textContent='Enviando...';send({tipo:'registro',estacion:S.n,responsable:state.who.v,cumplidos:ok,total:t,pct:Math.round(100*ok/t),pendientes:pen.join(' | '),obs:(state.obs&&state.obs.v)||'',detalle:det.join(' | ')}).then(r=>m.textContent=r?'Registro enviado. Gracias.':'No se pudo enviar (revisa conexión).')}
function rs(id){if(confirm('¿Reiniciar checklist de hoy?')){state={};save(id);stView(id)}}
function cp(id){const S=ST[id];let t=`Checklist ${S.n} - ${new Date().toLocaleString('es-CL')}\n`;S.s.forEach((sec,si)=>sec[1].forEach((it,ii)=>{const s=state[si+'_'+ii]||{};t+=(s.c?'✅ ':'⬜ ')+it[0]+(s.v?' ['+s.v+']':'')+'\n'}));if(state.obs&&state.obs.v)t+='Obs: '+state.obs.v;
const m=$('#msg');navigator.clipboard.writeText(t).then(()=>m.textContent='Resumen copiado.',()=>{m.textContent='No se pudo copiar automáticamente.'})}
function qrView(){let base;try{base=sessionStorage.getItem('base')}catch(e){}base=base||location.href.split('#')[0];
app.innerHTML=`<p class="np"><a href="#" onclick="location.hash='';return false" class="mu">← Volver</a></p><h1>Códigos QR por estación</h1>
<p class="mu np">Pega aquí el enlace publicado de esta página. Luego imprime esta hoja y pega cada QR en su estación.</p><input class="u np" id="base" value="${base}"><p class="np"><button class="btn" onclick="gen()">Actualizar QR</button><button class="btn g" onclick="print()">Imprimir</button></p><div class="qg" id="qg"></div>`;gen()}
function gen(){const b=$('#base').value.split('#')[0];try{sessionStorage.setItem('base',b)}catch(e){}const g=$('#qg');g.innerHTML='';
Object.keys(ST).forEach(k=>{const d=document.createElement('div');d.className='q';d.innerHTML='<div></div><b>'+ST[k].i+' '+ST[k].n+'</b>';g.appendChild(d);new QRCode(d.firstChild,{text:b+'#'+k,width:170,height:170})})}
addEventListener('hashchange',route);route();
</script></body></html>
